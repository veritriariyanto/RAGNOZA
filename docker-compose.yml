version: "3.8"

services:
  # ── Service utama — RAG pipeline, LangChain 1.3.x, port 8000 ──────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragnoza_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      # URL evaluator service — gunakan nama Docker service (bukan localhost)
      EVALUATOR_URL: http://evaluator:8001
      EVALUATOR_TIMEOUT_SECONDS: "120"
      # Database
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ragnoza_db
      PGUSER: postgres
      PGPASSWORD: ragnoza123
      # Qdrant
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    depends_on:
      - postgres
      - qdrant
      # Evaluator TIDAK di depends_on — agar service utama tetap jalan
      # meski evaluator down (evaluasi opsional, bukan blocking)
    volumes:
      - ./logs:/app/logs

  # ── Service evaluator — RAGAS, langchain 0.3.x, port 8001 ─────────────────
  evaluator:
    build:
      context: ./evaluator
      dockerfile: Dockerfile
    container_name: ragnoza_evaluator
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      # Evaluator tidak butuh akses Qdrant atau Postgres langsung
      # (data sudah dikirim oleh service utama via HTTP payload)
    # Evaluator TIDAK depends_on postgres/qdrant karena tidak akses langsung

  # ── Streamlit UI — Frontend dashboard, port 8501 ─────────────────────────────
  streamlit:
    build:
      context: ./streamlit_app
      dockerfile: Dockerfile
    container_name: ragnoza_streamlit
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://app:8000/api/v1
      EVALUATOR_BASE_URL: http://evaluator:8001/api/v1
      PROJECT_NAME: RAGNOZA AI
      DEBUG: "True"
    depends_on:
      - app
    volumes:
      - ./streamlit_app:/app

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: postgres
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ragnoza123
      POSTGRES_DB: ragnoza_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ── Qdrant ──────────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: "no"
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
