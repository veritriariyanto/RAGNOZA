name: Build and Push to GHCR

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Gunakan Step Outputs agar nilai variabel pasti siap dipakai step berikutnya
      - name: Set Image Vars
        id: vars
        shell: bash
        run: |
          echo "image_name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "short_sha=$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 1. Build & Push Service: APP ──
      - name: Build and push 'app' image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}/app:latest
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}/app:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 2. Build & Push Service: EVALUATOR ──
      - name: Build and push 'evaluator' image
        uses: docker/build-push-action@v6
        with:
          context: ./evaluator
          file: ./evaluator/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}/evaluator:latest
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}/evaluator:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 3. Build & Push Service: STREAMLIT ──
      - name: Build and push 'streamlit' image
        uses: docker/build-push-action@v6
        with:
          context: ./streamlit_app
          file: ./streamlit_app/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}/streamlit:latest
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}/streamlit:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
