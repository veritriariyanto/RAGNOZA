name: Build and Push to GHCR

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "evaluator/**"
      - "streamlit_app/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/**"

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Normalisasi nama repository (lowercase) & Ambil Short SHA
      - name: Set environment variables
        shell: bash
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 1. Build & Push Service: APP ──
      - name: Build and push 'app' image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/app:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/app:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 2. Build & Push Service: EVALUATOR ──
      - name: Build and push 'evaluator' image
        uses: docker/build-push-action@v5
        with:
          context: ./evaluator
          file: ./evaluator/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/evaluator:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/evaluator:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 3. Build & Push Service: STREAMLIT ──
      - name: Build and push 'streamlit' image
        uses: docker/build-push-action@v5
        with:
          context: ./streamlit_app
          file: ./streamlit_app/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/streamlit:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/streamlit:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
