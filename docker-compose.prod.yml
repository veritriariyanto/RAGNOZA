version: "3.8"

# Compose file untuk VPS — pull image dari GHCR, bukan build lokal.
# Pakai: docker compose -f docker-compose.prod.yml pull
#        docker compose -f docker-compose.prod.yml up -d

services:
  app:
    image: ghcr.io/veritriariyanto/ragnoza/app:${IMAGE_TAG:-main}
    container_name: ragnoza_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      EVALUATOR_URL: http://evaluator:8001
      EVALUATOR_TIMEOUT_SECONDS: "120"
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-ragnoza_db}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    depends_on:
      - postgres
      - qdrant
    volumes:
      - ./logs:/app/logs

  evaluator:
    image: ghcr.io/veritriariyanto/ragnoza/evaluator:${IMAGE_TAG:-main}
    container_name: ragnoza_evaluator
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}

  streamlit:
    image: ghcr.io/veritriariyanto/ragnoza/streamlit:${IMAGE_TAG:-main}
    container_name: ragnoza_streamlit
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      API_BASE_URL: http://app:8000/api/v1
      EVALUATOR_BASE_URL: http://evaluator:8001/api/v1
      PROJECT_NAME: RAGNOZA AI
      DEBUG: "False"
    depends_on:
      - app

  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ragnoza_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
